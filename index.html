    :root {
      --primary: #4D6BFE;
      --primary-light: #eef2ff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    /* === 布局结构 === */
    .app-layout {
      display: flex;
      height: 100%;
    }

    .preview-highlight {
      background-color: rgba(255, 213, 79, 0.3) !important;
      outline: 2px solid #ffc107;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    /* 左侧菜单栏 */
    .sidebar {
      width: 300px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 20px 20px;
      font-size: 19px;
      font-weight: 700;
      color: #000000;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .chapter-title {
      font-size: 12px;
      color: #2c2c2c;
      padding: 10px 5px 5px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .menu-item {
      padding: 12px 15px;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 4px;
      transition: all 0.2s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-item:hover {
      background: #f3f4f6;
    }

    .menu-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .menu-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e5e7eb;
      color: #555;
      flex-shrink: 0;
    }

    .tutorial-btn {
      display: flex;
      /* 或 inline-block，视布局而定 */
      padding: 12px 0px 12px 16px;
      background-color: #f0f2f5;
      /* 根据实际主题色调整 */
      color: #333;
      text-decoration: none;
      font-size: 14px;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tutorial-btn:hover {
      background-color: #e0e4ea;
    }

    .menu-tag.core {
      background: #dcfce7;
      color: #166534;
    }

    .menu-tag.advanced {
      background: #fef3c7;
      color: #92400e;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #F9FAFB;
      min-width: 0;
      /* 关键：防止flex子项溢出 */
    }

    /* 主内容双栏布局 */
    .content-split {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 20px;
      overflow: hidden;
      min-width: 0;
      /* 关键：防止溢出 */
    }

    /* 左栏：表单 */
    .form-panel {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      overflow-y: auto;
      min-width: 0;
      /* 关键：限制最小宽度 */
    }

    .page-header {
      margin-bottom: 25px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .meta-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
    }

    .meta-text {
      color: var(--text-sub);
      font-size: 13px;
    }

    .scene-tip {
      background: #fffbeb;
      color: #b45309;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 表单组件 */
    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      transition: border 0.3s;
      background: #fff;

      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
      line-height: 1.5;
    }

    .addon-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

      font-size: 14px;
      color: #166534;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .addon-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #15803d;
    }

    .addon-item input {
      cursor: pointer;
    }

    .preview-panel {
      width: 45%;
      min-width: 400px;
      /* 最小宽度 */
      background: #fff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .preview-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .preview-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c2c2c;
    }

    .btn-copy {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-copy:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    /* 预览内容区 */
    .preview-body {
      flex: 1;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
      overflow-y: auto;
      overflow-x: hidden;
      /* 隐藏横向滚动条 */
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      /* 保留空格和换行 */
      word-break: break-word;
      /* 强制长单词换行 */
      line-height: 1.6;
    }

    /* Toast 组件 */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast-msg {
      background: #323232;
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
      animation: fadeInOut 3s ease-out forwards;
    }

    .toast-msg.success {
      background: #16a34a;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }

      10% {
        opacity: 1;
        transform: translateY(0);
      }

      90% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* 空状态 (这段其实会在初始化时被覆盖) */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 16px;
      flex-direction: column;
      gap: 15px;
    }
  </style>
</head>

        "类型": "进阶Prompt",
        "适用场景": "考前2周，不想再学新技巧，需要“调整状态、巩固已有能力、避免考前焦虑”",
        "Prompt模板": "你是一位公考行测备考教练。我还有[如“14天”]就要考试了。请帮我制定“考前2周冲刺调整计划”。\n═══════════════════════════\n【我的目前水平】：\n- 各模块正确率：[粘贴最新数据]\n- 最近一次模考分数：[如“67分”]\n- 目标分数：[如“72分”]\n【我目前已掌握的技巧】：[列出你的技巧卡片清单，如“技巧1：削弱力度排序；技巧2：资料分析截位直除；技巧3：主旨题结构分析法……”]\n【我目前还存在的弱点】：[如“数量关系还是只能做对6/15”/“语句排序题还是不太稳”]\n【我的心理状态】：[如“有点焦虑，担心考场上发挥不好”/“比较平静，但怕最后两周退步”]\n═══════════════════════════\n请输出：\n一、考前2周总体策略\n- 这2周的关键词是什么？（如“巩固+调整+信心”，而非“学新东西”）\n- 每天的时间怎么分配？\n- 什么该做？什么不该做？（如：不该学新技巧、不该做太难的题打击信心）\n二、每日计划（14天）\n| 日期 | 上午 | 下午 | 晚上 | 备注 |\n|------|------|------|------|------|\n| 倒数第14天 | …… | …… | …… | |\n| …… | | | | |\n| 考试前一天 | …… | …… | …… | |\n三、“技巧卡片”复习计划\n- 哪些技巧卡片每天要看？（核心技巧）\n- 哪些技巧卡片隔天看？（辅助技巧）\n- 考前最后一天只看哪几张？\n四、模考安排\n- 这2周做几次完整模考？什么时候做？\n- 模考后怎么复盘？（不要“对完答案就完了”）\n- 最后一次模考安排在考前几天？\n五、考场“锦囊”\n- 基于我的弱点，考场上最需要注意的3件事是什么？\n- 遇到不会的题，我的“默认策略”是什么？\n- 如果考场上紧张了，怎么快速调整？\n六、心理建设\n- 考前焦虑是正常的吗？怎么看待？\n- 给我3句“考前心理暗示”\n- 考试当天早上的“启动仪式”建议（帮我进入状态）"
      }
    ];

    // ================== 核心逻辑 ==================

    // 1. Toast 通知功能
    function showToast(message, type = 'default') {
      const container = document.getElementById('toast-container');
      const div = document.createElement('div');
      div.className = `toast-msg ${type}`;
      div.textContent = message;
      container.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    // 2. 状态管理
    let state = { currentId: '', formData: {}, selectedAddons: new Set() };

    // 3. 初始化菜单 (核心修改)
    function initMenu() {
      const box = document.getElementById('menu-box');
      box.innerHTML = '';

      const chapters = {};
      PROMPT_DATA.forEach(item => {
        if (!chapters[item.章节]) chapters[item.章节] = [];
        chapters[item.章节].push(item);
      });

      // 用于记录第一个有效的菜单项，以便默认选中
      let firstValidItem = null;

      for (let name in chapters) {
        const sec = document.createElement('div');
        sec.innerHTML = `<div class="chapter-title">${name}</div>`;

        chapters[name].forEach(item => {
          if (item.类型 === '追加Prompt片段') return;

          const div = document.createElement('div');
          div.className = 'menu-item';
          const id = `${item.章节}-${item.小节}`;

          let tag = '';
          if (item.类型 === '核心Prompt') tag = '<span class="menu-tag core">核心</span>';
          else if (item.类型 === '进阶Prompt') tag = '<span class="menu-tag advanced">进阶</span>';

          div.innerHTML = `${item.小节} ${item.标题} ${tag}`;

          // 绑定点击事件
          div.onclick = (e) => selectItem(id, item, e.currentTarget);

          // 如果还没有记录过第一项，记录下当前项（DOM元素和数据）
          if (!firstValidItem) {
            firstValidItem = { element: div, data: item, id: id };
          }

          sec.appendChild(div);
        });
        box.appendChild(sec);
      }

      // 修改点：初始化完成后，自动选中第一项
      if (firstValidItem) {
        selectItem(firstValidItem.id, firstValidItem.data, firstValidItem.element);
      }
    }

    // 4. 选中菜单
    function selectItem(id, item, element) {
      // 清除所有菜单的高亮样式
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      // 为当前选中的项添加高亮
      element.classList.add('active');

      state.currentId = id;
      state.formData = {};
      state.selectedAddons = new Set();

      renderMain(item);
    }

    // 5. 渲染主区域
    function renderMain(item) {
      const area = document.getElementById('main-area');

      let formHtml = `
        <div class="form-panel">
            <div class="page-header">
                <div class="page-title">${item.标题}</div>
                <div class="meta-text" style="margin-top:8px;">
                    <span class="meta-badge">${item.类型}</span>
                    ${item.章节} - ${item.小节}
                </div>
                ${item.适用场景 ? `<div class="scene-tip"><strong>适用场景：</strong>${item.适用场景}</div>` : ''}
            </div>
            <div id="dynamic-forms"></div>
            <div id="addon-area"></div>
        </div>
    `;

      let previewHtml = `
        <aside class="preview-panel">
            <div class="preview-header">
                <span class="preview-title">Prompt 预览</span>
                <button class="btn-copy" onclick="copyAction()">
                    复制
                </button>
            </div>
            <div class="preview-body" id="preview-content"></div>
        </aside>
    `;

      area.innerHTML = formHtml + previewHtml;

      renderInputs(item["Prompt模板"]);
      // renderAddons(item.小节);
      updatePreview();
    }

    // 6. 渲染输入框
    function renderInputs(template) {
      const container = document.getElementById('dynamic-forms');
      const regex = /\[(.*?)\]/g;
      let match;
      let html = '';

      let idx = 0;
      while ((match = regex.exec(template)) !== null) {
        const raw = match[0];
        const label = match[1];

        const isLong = label.includes('粘贴') || label.includes('材料') || label.includes('作答');
        const cleanLabel = label.replace(/^在此/, '').replace(/，如.*/, '');

        html += `
            <div class="input-group">
                <label class="input-label">${cleanLabel}</label>
                <${isLong ? 'textarea' : 'input'} 
                    class="form-control" 
                    placeholder="${label.includes('如') ? label : '...'}"
                    oninput="updateData('${raw}', this.value)"
                    rows="4"
                ></${isLong ? 'textarea' : 'input'}>
            </div>
        `;
        idx++;
      }
      container.innerHTML = html;
    }

    // 7. 渲染追加项
    function renderAddons(currentSection) {
      const container = document.getElementById('addon-area');
      const addons = PROMPT_DATA.filter(p => p.关联 && p.关联.includes(currentSection));

      if (addons.length === 0) {
        container.innerHTML = '';
        return;
      }

      let html = `<div class="addon-box"><h4>可选追加配置</h4>`;
      addons.forEach(add => {
        html += `
            <div class="addon-item">
                <input type="checkbox" id="add-${add.小节}" onchange="toggleAdd('${add.小节}', this.checked)">
                <label for="add-${add.小节}">${add.标题}</label>
            </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // 8. 更新数据
    function updateData(key, val) {
      state.formData[key] = val;
      updatePreview();
    }

    // 9. 切换追加
    function toggleAdd(section, checked) {
      if (checked) state.selectedAddons.add(section);
      else state.selectedAddons.delete(section);
      updatePreview();
    }

    // 10. 更新预览
    function updatePreview() {
      const preview = document.getElementById('preview-content');
      if (!preview) return;

      const item = PROMPT_DATA.find(i => `${i.章节}-${i.小节}` === state.currentId);
      if (!item) return;

      let text = item["Prompt模板"];
      for (let k in state.formData) {
        text = text.split(k).join(state.formData[k]);
      }

      state.selectedAddons.forEach(addonId => {
        const addon = PROMPT_DATA.find(i => i.小节 === addonId);
        if (addon) {
          text += `\n\n============ [追加] ${addon.标题} ============\n${addon["Prompt模板"]}`;
        }
      });

      preview.innerText = text;
    }

    // 11. 复制动作
    function copyAction() {
      const text = document.getElementById('preview-content').innerText;
      navigator.clipboard.writeText(text).then(() => {
        showToast('复制成功！已保存到剪贴板', 'success');
      }).catch(err => {
        showToast('复制失败，请手动复制', 'error');
      });
    }

    // 初始化
    initMenu();

  </script>
</body>

</html>
